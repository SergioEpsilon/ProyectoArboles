<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SkyBalance</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- SIDEBAR -->
    <div id="sidebar">
    <h1>✈️ Sky<span>Balance</span></h1>

    <div>
        <div class="section-label">Modo</div>
        <div class="mode-row">
        <button class="mode-btn active" id="btn-bst" onclick="setMode('BST')">BST</button>
        <button class="mode-btn"        id="btn-avl" onclick="setMode('AVL')">AVL</button>
        </div>
    </div>

    <div>
        <div class="section-label">Operaciones</div>
        <input type="text" id="val-input" placeholder="Valor del vuelo" onkeydown="if(event.key==='Enter') insert()">
        <input type="text" id="val-new-input" placeholder="Nuevo valor (modificar)" onkeydown="if(event.key==='Enter') modifyNode()">
        <div class="btn-row">
        <button class="btn btn-green" onclick="insert()">＋ Insertar</button>
        <button class="btn btn-red"   onclick="deleteNode()">－ Eliminar</button>
        <button class="btn btn-ghost" onclick="modifyNode()">✏ Modificar</button>
        <button class="btn btn-red" onclick="cancelFlight()">✈ Cancelar vuelo</button>
        <button class="btn btn-ghost" onclick="undoAction()">↩ Deshacer</button>
        <button class="btn btn-ghost" onclick="exportTreeJson()">⤓ Exportar JSON</button>
        <button class="btn btn-ghost" onclick="clearTree()">Limpiar árbol</button>
        <button class="btn btn-demo"  onclick="loadDemo()">Cargar demo</button>
        </div>
    </div>

    <div>
        <div class="section-label">Carga Inicial (JSON)</div>
        <input type="file" id="json-file-input" accept="application/json" style="display:none" onchange="handleJsonFileSelection(event)">
        <div class="btn-row">
        <button class="btn btn-ghost" onclick="openJsonPicker()">Seleccionar JSON</button>
        </div>
    </div>

    <div>
        <div class="section-label">Recorridos</div>
        <button class="trav-btn" id="t-preorder"  onclick="runTraversal('preorder')">Pre-Order (raíz–izq–der)</button>
        <button class="trav-btn" id="t-inorder"   onclick="runTraversal('inorder')">In-Order (izq–raíz–der)</button>
        <button class="trav-btn" id="t-postorder" onclick="runTraversal('postorder')">Post-Order (izq–der–raíz)</button>
        <button class="trav-btn" id="t-level"     onclick="runTraversal('level')">Por Niveles (BFS)</button>
    </div>

    <div id="stats" style="display:none">
        <div class="section-label">Estadísticas</div>
        <div class="stat-row"><span>Nodos</span><span id="s-nodes">0</span></div>
        <div class="stat-row"><span>Altura</span><span id="s-height">0</span></div>
        <div class="stat-row"><span>Balance raíz</span><span id="s-bf">0</span></div>
        <div class="stat-row"><span>Mínimo</span><span id="s-min">—</span></div>
        <div class="stat-row"><span>Máximo</span><span id="s-max">—</span></div>
    </div>
    </div>

    <!-- MAIN -->
    <div id="main">
    <div id="result-bar"></div>
    <div id="canvas-wrap">
        <div class="empty-msg" id="empty-msg">
        <div class="icon">🌿</div>
        <p>El árbol está vacío</p>
        <p style="font-size:11px">Inserta un valor o carga la demo</p>
        </div>
        <svg id="tree-svg" style="display:none"></svg>
    </div>
    <div id="log-bar">
        <div class="log-label">Log</div>
        <div id="log-entries"><div class="log-entry log-info">Sin actividad.</div></div>
    </div>
    </div>

    <script>
    // ─── TREE NODE ───────────────────────────────
    function Node(v) { this.val = v; this.left = this.right = null; this.height = 1; }

    // ─── BST ─────────────────────────────────────
    function bstInsert(r, v) {
        if (!r) return new Node(v);
        if (v < r.val) r.left = bstInsert(r.left, v);
        else if (v > r.val) r.right = bstInsert(r.right, v);
        return r;
    }
    function bstDelete(r, v) {
        if (!r) return null;
        if (v < r.val) { r.left = bstDelete(r.left, v); return r; }
        if (v > r.val) { r.right = bstDelete(r.right, v); return r; }
        if (!r.left) return r.right;
        if (!r.right) return r.left;
        let s = r.right; while (s.left) s = s.left;
        r.val = s.val; r.right = bstDelete(r.right, s.val);
        return r;
    }

    // ─── AVL ─────────────────────────────────────
    function ht(n) { return n ? n.height : 0; }
    function bf(n) { return n ? ht(n.left) - ht(n.right) : 0; }
    function upH(n) { n.height = 1 + Math.max(ht(n.left), ht(n.right)); }
    function rotR(y) { const x=y.left,T=x.right; x.right=y; y.left=T; upH(y); upH(x); return x; }
    function rotL(x) { const y=x.right,T=y.left; y.left=x; x.right=T; upH(x); upH(y); return y; }
    function bal(n) {
        upH(n);
        const b = bf(n);
        if (b >  1) { if (bf(n.left)  < 0) n.left  = rotL(n.left);  return rotR(n); }
        if (b < -1) { if (bf(n.right) > 0) n.right = rotR(n.right); return rotL(n); }
        return n;
    }
    function avlInsert(r, v) {
        if (!r) return new Node(v);
        if (v < r.val) r.left = avlInsert(r.left, v);
        else if (v > r.val) r.right = avlInsert(r.right, v);
        else return r;
        return bal(r);
    }
    function avlDelete(r, v) {
        if (!r) return null;
        if (v < r.val) r.left = avlDelete(r.left, v);
        else if (v > r.val) r.right = avlDelete(r.right, v);
        else {
            if (!r.left || !r.right) return r.left || r.right;
            let s = r.right; while (s.left) s = s.left;
            r.val = s.val; r.right = avlDelete(r.right, s.val);
        }
        return bal(r);
    }

    // ─── LAYOUT ──────────────────────────────────
    const NR = 26, VG = 74;
    function treeW(n) { if (!n) return 0; return Math.max(treeW(n.left) + treeW(n.right), 1); }
    function layout(n, d, l, r, pos) {
        if (!n) return;
        const mid = (l + r) / 2;
        pos[n.val] = { x: mid, y: d * VG + NR + 20 };
        layout(n.left,  d + 1, l,   mid, pos);
        layout(n.right, d + 1, mid, r,   pos);
    }
    function getLayout(root) {
        const pos = {};
        if (!root) return pos;
        const w = Math.max(treeW(root) * (NR * 2 + 20), 560);
        layout(root, 0, 0, w, pos);
        let minX = Infinity;
        Object.values(pos).forEach(p => { if (p.x < minX) minX = p.x; });
        const off = minX < NR + 8 ? NR + 8 - minX : 0;
        Object.values(pos).forEach(p => p.x += off);
        return pos;
    }
    function getEdges(n, pos, edges = []) {
        if (!n) return edges;
        if (n.left  && pos[n.val] && pos[n.left.val])  edges.push({ f: pos[n.val], t: pos[n.left.val]  });
        if (n.right && pos[n.val] && pos[n.right.val]) edges.push({ f: pos[n.val], t: pos[n.right.val] });
        getEdges(n.left,  pos, edges);
        getEdges(n.right, pos, edges);
        return edges;
    }

    // ─── STATE ───────────────────────────────────
        // Base URL used by all backend requests.
        const API_BASE = 'http://127.0.0.1:5000';

    let root = null;
    let mode = 'BST';
    let highlighted = new Set();
    let pathNodes   = new Set();
    let activeTrav  = '';

        // Open the native file picker so user can choose JSON file from disk.
        function openJsonPicker() {
                document.getElementById('json-file-input').click();
        }

        // Read selected JSON file and load trees through backend endpoint.
        async function handleJsonFileSelection(event) {
                // Get first selected file from the input element.
                const file = event.target.files && event.target.files[0];
                if (!file) return;

                try {
                        // Read file content as plain text.
                        const rawText = await file.text();
                        // Parse JSON safely before sending to backend.
                        const parsedJson = JSON.parse(rawText);

                        // Send JSON payload to backend loader endpoint.
                        const response = await fetch(`${API_BASE}/load-json`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                        json_data: parsedJson,
                                })
                        });

                        // Parse backend response body.
                        const data = await response.json();

                        // Handle backend validation errors gracefully.
                        if (!response.ok) {
                                throw new Error(data.error || 'No se pudo cargar el archivo JSON.');
                        }

                        // Keep AVL as main operational tree in the primary interface.
                        mode = 'AVL';
                        root = data.main_avl || data.arbol || null;

                        // Synchronize mode buttons with forced AVL main mode.
                        document.getElementById('btn-bst').classList.remove('active');
                        document.getElementById('btn-avl').classList.add('active');

                        // Reset visual highlights after full tree replacement.
                        highlighted.clear();
                        pathNodes.clear();
                        activeTrav = '';
                        document.querySelectorAll('.trav-btn').forEach(b => b.classList.remove('active'));

                        // Render loaded AVL in the main canvas.
                        render();

                        // Log successful load with detected backend metadata.
                        addLog(
                                `JSON cargado (${data.load_mode || 'auto'}) - Clave: ${data.detected_key || 'auto'}`,
                                'ok'
                        );

                        // Open additional comparison window with AVL vs BST final structures.
                        openComparisonWindow(data.comparison, data.properties, data.load_mode, data.detected_key);
                } catch (error) {
                        // Show parsing/network/validation failures to the user.
                        addLog(`Error de carga JSON: ${error.message}`, 'err');
                        alert(`Error al cargar JSON: ${error.message}`);
                } finally {
                        // Clear input value so same file can be selected again.
                        event.target.value = '';
                }
        }

        // Render AVL/BST comparison in a dedicated browser window.
        function openComparisonWindow(comparison, properties, loadMode, detectedKey) {
                // Validate required payload fragments before opening window.
                if (!comparison || !comparison.avl || !comparison.bst) {
                        addLog('No hay datos suficientes para comparación AVL/BST.', 'err');
                        return;
                }

                // Open a separate browser window as requested in requirement 1.1.
                const win = window.open('', '_blank', 'width=1300,height=850');
                if (!win) {
                        addLog('El navegador bloqueó la ventana de comparación.', 'err');
                        return;
                }

                // Serialize comparison payload safely for window script consumption.
                const avlPayload = JSON.stringify(comparison.avl).replace(/</g, '\\u003c');
                const bstPayload = JSON.stringify(comparison.bst).replace(/</g, '\\u003c');
                const propsPayload = JSON.stringify(properties || {}).replace(/</g, '\\u003c');

                // Build a self-contained HTML page inside the new window.
                const html = `
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comparación AVL vs BST</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #0d1117; color: #c9d1d9; }
        .header { padding: 16px 20px; border-bottom: 1px solid #30363d; }
        .meta { font-size: 13px; color: #8b949e; margin-top: 6px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .card { border: 1px solid #30363d; border-radius: 8px; background: #161b22; overflow: hidden; }
        .title { padding: 10px 12px; border-bottom: 1px solid #30363d; font-weight: 700; }
        .props { display: flex; gap: 12px; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #30363d; }
        .prop-item { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 6px 8px; }
        .canvas { padding: 8px; overflow: auto; }
        svg { width: 100%; min-height: 460px; background: #0d1117; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="header">
        <h2 style="margin:0">Comparación Estructural AVL vs BST</h2>
        <div class="meta">Modo de carga: ${loadMode || 'auto'} | Clave detectada: ${detectedKey || 'auto'}</div>
    </div>
    <div class="grid">
        <div class="card">
            <div class="title">Árbol AVL (principal)</div>
            <div class="props" id="props-avl"></div>
            <div class="canvas"><svg id="svg-avl"></svg></div>
        </div>
        <div class="card">
            <div class="title">Árbol BST</div>
            <div class="props" id="props-bst"></div>
            <div class="canvas"><svg id="svg-bst"></svg></div>
        </div>
    </div>

    <script>
        // Parse serialized data passed from the main window.
        const avlTree = ${avlPayload};
        const bstTree = ${bstPayload};
        const props = ${propsPayload};

        // Render property badges for each tree card.
        function renderProps(containerId, data) {
            const container = document.getElementById(containerId);
            const values = data || {};
            container.innerHTML = '' +
                '<div class="prop-item">Raíz: ' + (values.root ?? '—') + '</div>' +
                '<div class="prop-item">Profundidad: ' + (values.depth ?? 0) + '</div>' +
                '<div class="prop-item">Hojas: ' + (values.leaves ?? 0) + '</div>' +
                '<div class="prop-item">Nodos: ' + (values.nodes ?? 0) + '</div>';
        }

        // Compute recursive width units for tree layout.
        function treeWidth(node) {
            if (!node) return 0;
            return Math.max(treeWidth(node.left) + treeWidth(node.right), 1);
        }

        // Assign positions using unique path keys to avoid value collisions.
        function assignPositions(node, depth, left, right, path, pos) {
            if (!node) return;
            const mid = (left + right) / 2;
            pos[path] = { x: mid, y: depth * 86 + 44, val: node.val };
            assignPositions(node.left, depth + 1, left, mid, path + 'L', pos);
            assignPositions(node.right, depth + 1, mid, right, path + 'R', pos);
        }

        // Collect parent-child edges using the same path keys.
        function collectEdges(node, path, pos, edges) {
            if (!node) return;
            const current = pos[path];
            if (node.left && pos[path + 'L']) edges.push({ from: current, to: pos[path + 'L'] });
            if (node.right && pos[path + 'R']) edges.push({ from: current, to: pos[path + 'R'] });
            collectEdges(node.left, path + 'L', pos, edges);
            collectEdges(node.right, path + 'R', pos, edges);
        }

        // Draw one tree into the target SVG element.
        function renderTree(svgId, treeRoot, palette) {
            const svg = document.getElementById(svgId);
            if (!treeRoot) {
                svg.innerHTML = '';
                return;
            }

            const pos = {};
            const unitWidth = Math.max(treeWidth(treeRoot) * 96, 560);
            assignPositions(treeRoot, 0, 0, unitWidth, 'R', pos);

            const edges = [];
            collectEdges(treeRoot, 'R', pos, edges);

            const keys = Object.keys(pos);
            const maxX = Math.max(...keys.map(k => pos[k].x)) + 44;
            const maxY = Math.max(...keys.map(k => pos[k].y)) + 44;
            svg.setAttribute('viewBox', '0 0 ' + maxX + ' ' + maxY);

            let html = '';
            edges.forEach(e => {
                html += '<line x1="' + e.from.x + '" y1="' + e.from.y + '" x2="' + e.to.x + '" y2="' + e.to.y + '" stroke="#30363d" stroke-width="2" />';
            });
            keys.forEach(k => {
                const p = pos[k];
                html += '<g>' +
                    '<circle cx="' + p.x + '" cy="' + p.y + '" r="26" fill="#0d1117" stroke="' + palette + '" stroke-width="2.2" />' +
                    '<text x="' + p.x + '" y="' + (p.y + 5) + '" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="700">' + p.val + '</text>' +
                    '</g>';
            });
            svg.innerHTML = html;
        }

        // Render cards and trees immediately after window is created.
        renderProps('props-avl', props.avl || {});
        renderProps('props-bst', props.bst || {});
        renderTree('svg-avl', avlTree, '#58a6ff');
        renderTree('svg-bst', bstTree, '#f2cc60');
    <\/script>
</body>
</html>
                `;

                // Write generated markup to the newly opened window.
                win.document.open();
                win.document.write(html);
                win.document.close();
        }

    function setMode(m) {
        mode = m;
        document.getElementById('btn-bst').classList.toggle('active', m === 'BST');
        document.getElementById('btn-avl').classList.toggle('active', m === 'AVL');
        clearTree();
    }

    // Parse text input into int/float/string so flights can be numeric or alphanumeric.
    function parseTreeInput(raw) {
        if (raw === null || raw === undefined) return null;
        const text = String(raw).trim();
        if (!text) return null;

        const numericPattern = /^-?\d+(\.\d+)?$/;
        if (numericPattern.test(text)) {
            const asNumber = Number(text);
            return Number.isNaN(asNumber) ? text : asNumber;
        }
        return text;
    }

    // Normalize backend errors in one place for all mutation requests.
    async function readResponseOrThrow(response) {
        const payload = await response.json();
        if (!response.ok) {
            throw new Error(payload.error || 'La operación no pudo completarse.');
        }
        return payload;
    }

    async function insert() {
        const v = parseTreeInput(document.getElementById('val-input').value);
        if (v === null) return;

        try {
            const response = await fetch(`${API_BASE}/insert`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ valor: v, modo: mode })
            });

            const data = await readResponseOrThrow(response);
            root = data.arbol;
            document.getElementById('val-input').value = '';
            addLog(`Insertado: ${v}`, 'ok');
            render();
        } catch (error) {
            addLog(`Error al insertar: ${error.message}`, 'err');
            alert(`Error al insertar: ${error.message}`);
        }
    }

    async function deleteNode() {
        const v = parseTreeInput(document.getElementById('val-input').value);
        if (v === null) return;

        try {
            const response = await fetch(`${API_BASE}/delete`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ valor: v, modo: mode })
            });

            const data = await readResponseOrThrow(response);
            root = data.arbol;
            document.getElementById('val-input').value = '';
            addLog(`Eliminado: ${v}`, 'err');
            render();
        } catch (error) {
            addLog(`Error al eliminar: ${error.message}`, 'err');
            alert(`Error al eliminar: ${error.message}`);
        }
    }

    async function modifyNode() {
        const oldValue = parseTreeInput(document.getElementById('val-input').value);
        const newValue = parseTreeInput(document.getElementById('val-new-input').value);
        if (oldValue === null || newValue === null) {
            alert('Debes ingresar valor actual y nuevo valor para modificar.');
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/modify`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ old_valor: oldValue, new_valor: newValue, modo: mode })
            });

            const data = await readResponseOrThrow(response);
            root = data.arbol;
            document.getElementById('val-input').value = '';
            document.getElementById('val-new-input').value = '';
            addLog(`Modificado: ${oldValue} → ${newValue}`, 'ok');
            render();
        } catch (error) {
            addLog(`Error al modificar: ${error.message}`, 'err');
            alert(`Error al modificar: ${error.message}`);
        }
    }

    async function cancelFlight() {
        const v = parseTreeInput(document.getElementById('val-input').value);
        if (v === null) {
            alert('Debes ingresar el vuelo a cancelar.');
            return;
        }

        if (!confirm(`Se eliminará el vuelo ${v} y toda su descendencia. ¿Continuar?`)) {
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/cancel`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ valor: v, modo: mode })
            });

            const data = await readResponseOrThrow(response);
            root = data.arbol;
            document.getElementById('val-input').value = '';
            addLog(`Cancelado (subárbol): ${v}`, 'err');
            render();
        } catch (error) {
            addLog(`Error al cancelar: ${error.message}`, 'err');
            alert(`Error al cancelar: ${error.message}`);
        }
    }

    async function undoAction() {
        try {
            const response = await fetch(`${API_BASE}/undo`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ modo: mode })
            });

            const data = await readResponseOrThrow(response);
            root = data.arbol;
            highlighted.clear();
            pathNodes.clear();
            activeTrav = '';
            document.querySelectorAll('.trav-btn').forEach(b => b.classList.remove('active'));
            addLog(`Deshacer aplicado (${data.undone_action || 'acción previa'})`, 'info');
            render();
        } catch (error) {
            addLog(`No se pudo deshacer: ${error.message}`, 'info');
        }
    }

    async function exportTreeJson() {
        try {
            const response = await fetch(`${API_BASE}/export-json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ modo: mode })
            });

            const payload = await readResponseOrThrow(response);
            const prettyJson = JSON.stringify(payload, null, 2);
            const blob = new Blob([prettyJson], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            const now = new Date();
            const stamp = now.toISOString().replace(/[:.]/g, '-');
            const fileName = `skybalance-tree-export-${mode}-${stamp}.json`;

            // Trigger browser download without leaving the current page.
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);

            addLog(`Exportado JSON (${mode})`, 'ok');
        } catch (error) {
            addLog(`Error al exportar JSON: ${error.message}`, 'err');
            alert(`Error al exportar JSON: ${error.message}`);
        }
    }

    async function clearTree() {
        try {
            const response = await fetch(`${API_BASE}/clear`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });

            await readResponseOrThrow(response);
            root = null;
            highlighted.clear(); pathNodes.clear(); activeTrav = '';
            document.querySelectorAll('.trav-btn').forEach(b => b.classList.remove('active'));
            addLog('Árbol limpiado', 'info');
            render();
        } catch (error) {
            addLog(`Error al limpiar árbol: ${error.message}`, 'err');
            alert(`Error al limpiar árbol: ${error.message}`);
        }
    }

    function loadDemo() {
        root = null;
        [30, 20, 40, 10, 25, 35, 50].forEach(v => {
            root = mode === 'AVL' ? avlInsert(root, v) : bstInsert(root, v);
        });
        highlighted.clear(); pathNodes.clear(); activeTrav = '';
        addLog('Demo cargado: [30,20,40,10,25,35,50]', 'ok');
        render();
    }

    async function runTraversal(type) {
        if (!root) return;

        let res = [];
        try {
            const response = await fetch(`${API_BASE}/traversal`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ modo: mode, tipo: type })
            });

            const data = await readResponseOrThrow(response);
            res = data.resultado;
        } catch (error) {
            addLog(`Error en recorrido ${type}: ${error.message}`, 'err');
            alert(`Error en recorrido ${type}: ${error.message}`);
            return;
        }

        highlighted = new Set(res);
        pathNodes.clear();
        activeTrav = type;

        document.querySelectorAll('.trav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('t-' + type).classList.add('active');
        addLog(`${type}: [${res.join(', ')}]`, 'info');
        showResult(type, res, false);
        render();
    }

    // ─── LOG ─────────────────────────────────────
    function addLog(msg, type) {
        const el  = document.getElementById('log-entries');
        const cls = type === 'ok' ? 'log-ok' : type === 'err' ? 'log-err' : 'log-info';
        el.innerHTML = `<div class="log-entry ${cls}">› ${msg}</div>` + el.innerHTML;
    }

    // ─── RESULT BAR ──────────────────────────────
    function showResult(label, arr, isPath) {
        const bar       = document.getElementById('result-bar');
        const pillClass = isPath ? 'result-pill path' : 'result-pill';
        bar.innerHTML   = `<span class="result-label">${label}</span>` +
            arr.map(v => `<span class="${pillClass}">${v}</span>`).join('');
    }

    // ─── RENDER ──────────────────────────────────
    function render() {
        const svg   = document.getElementById('tree-svg');
        const empty = document.getElementById('empty-msg');
        const stats = document.getElementById('stats');

        if (!root) {
            svg.style.display   = 'none';
            empty.style.display = 'flex';
            stats.style.display = 'none';
            document.getElementById('result-bar').innerHTML = '';
            return;
        }

        empty.style.display = 'none';
        svg.style.display   = 'block';
        stats.style.display = 'block';

        const pos   = getLayout(root);
        const edges = getEdges(root, pos);
        const vals  = Object.keys(pos);
        const xs    = vals.map(v => pos[v].x);
        const ys    = vals.map(v => pos[v].y);
        const W     = Math.max(...xs) + NR + 24;
        const H     = Math.max(...ys) + NR + 24;

        svg.setAttribute('width',   W);
        svg.setAttribute('height',  H);
        svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

        let html = '';

        edges.forEach(e => {
            html += `<line x1="${e.f.x}" y1="${e.f.y}" x2="${e.t.x}" y2="${e.t.y}"
                stroke="#21262d" stroke-width="2" stroke-linecap="round"/>`;
        });

        vals.forEach(v => {
            // Keep node identity as string to support numeric and alphanumeric values.
            const nodeKey = String(v);
            const p = pos[v];

            // Match highlighted/path sets using raw value and string fallback.
            const isPath = pathNodes.has(v) || pathNodes.has(nodeKey);
            const isHl = highlighted.has(v) || highlighted.has(nodeKey);
            const fill   = isPath ? '#bc8cff22' : isHl ? '#58a6ff22' : '#161b22';
            const stroke = isPath ? '#bc8cff'   : isHl ? '#58a6ff'   : '#30363d';
            const sw     = (isPath || isHl) ? 2.5 : 1.5;
            const filter = (isPath || isHl) ? `filter:drop-shadow(0 0 7px ${stroke}66)` : '';
            html += `<g style="${filter}">
                <circle cx="${p.x}" cy="${p.y}" r="${NR}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>
                <text x="${p.x}" y="${p.y + 5}" text-anchor="middle" font-size="13"
                    font-weight="700" font-family="IBM Plex Mono,monospace"
                    fill="${(isPath || isHl) ? '#fff' : '#c9d1d9'}">${nodeKey}</text>
            </g>`;
        });

        svg.innerHTML = html;

        // stats
        function inorder(n, a = []) { if (!n) return a; inorder(n.left, a); a.push(n.val); inorder(n.right, a); return a; }
        const nodes = inorder(root);
        document.getElementById('s-nodes').textContent  = nodes.length;
        document.getElementById('s-height').textContent = ht(root);
        document.getElementById('s-bf').textContent     = bf(root);

        // Compute min/max safely for both numbers and strings.
        const isNumeric = nodes.every(n => typeof n === 'number');
        if (isNumeric) {
            document.getElementById('s-min').textContent = Math.min(...nodes);
            document.getElementById('s-max').textContent = Math.max(...nodes);
        } else {
            const normalized = nodes.map(n => String(n));
            const sortedValues = normalized.slice().sort((a, b) => a.localeCompare(b));
            document.getElementById('s-min').textContent = sortedValues[0] || '—';
            document.getElementById('s-max').textContent = sortedValues.length ? sortedValues[sortedValues.length - 1] : '—';
        }
    }

    render();

    // Keyboard shortcut for undo: Ctrl+Z / Cmd+Z.
    document.addEventListener('keydown', (event) => {
        const isUndoShortcut = (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z';
        if (!isUndoShortcut) return;

        event.preventDefault();
        undoAction();
    });
    </script>
</body>
</html>
